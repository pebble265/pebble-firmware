; pebble(a) robot firmware — ESP32 (Arduino framework)
; Build & upload:  pio run -t upload   ·   Serial monitor:  pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; BLE + Wi-Fi + TLS need more than the default 1.2 MB app slot
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  knolleary/PubSubClient@^2.8
  links2004/WebSockets@^2.4.1
